<!DOCTYPE html>

    Scanner Patrimonial - ACADEPOL
  </title>


  <script

  ></script>

  <!--
    Leitura reforçada para etiquetas patrimoniais.

  -->
  <script
    src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.9.15/dist/index.js"
  ></script>

  <script

  ></script>


  <style>

<body>

<header>

  <div class="cabecalho">

    <div class="titulo">
      SCANNER PATRIMONIAL
    </div>

    <div class="subtitulo">
      ACADEPOL · PCSC
    </div>

  </div>

</header>


<main>

  <section class="painel">

    <div
      id="status"
      class="status"
    >
      Preparando câmera...
    </div>


    <div
      id="reader"
    ></div>


    <div class="botoes">

      <button
        id="btnIniciar"
        class="principal"
        onclick="iniciarScanner()"
      >
        INICIAR CÂMERA
      </button>


      <button
        id="btnParar"
        class="secundario"
        onclick="pararScanner()"
      >
        PARAR CÂMERA
      </button>

    </div>

  </section>


  <section class="painel">

    <div class="contador">

      <div class="card">

        <div class="cardTitulo">
          LIDOS
        </div>

          id="quantidade"
          class="cardValor"
        >
          0
        </div>

      </div>


      <div class="card">

        <div class="cardTitulo">
          ÚLTIMO
        </div>

        <div
          id="ultimo"
          class="cardValor"
          style="font-size:18px"
        >
          -
        </div>

      </div>

    </div>


    <div class="ajuda">
      Aponte a câmera para a etiqueta.
      Quando o código for identificado ele será enviado
      automaticamente para a Consulta Patrimonial.
      Você pode continuar apontando para o próximo patrimônio.
    </div>


    <div
      id="lista"
      class="lista"
    ></div>

  </section>

</main>


<script>

let leitor = null;

let scannerRodando =
  false;

let returnOrigin =
  '';

let ultimoNormalizado =
  '';

let ultimoHorario =
  0;

const lidos =
  new Set();

let zbarDetector =
  null;

let zbarTimer =
  null;

let zbarBusy =
  false;

let zbarTentativa =
  0;

const zbarCanvas =
  document.createElement(
    'canvas'
  );

const zbarContext =
  zbarCanvas.getContext(
    '2d',
    {
      willReadFrequently:
        true
    }
  );


/************************************************************
 * INICIALIZAÇÃO
 ************************************************************/
window.addEventListener(
  'load',
  function() {

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    returnOrigin =
      String(
        parametros.get(
          'returnOrigin'
        ) || ''
      ).trim();

    /*
     * Tenta iniciar automaticamente.
     *
     * Se o navegador exigir interação,
     * o usuário ainda tem o botão
     * INICIAR CÂMERA.
     */
    setTimeout(
      function() {
        iniciarScanner();
      },
      300
    );

  }
);


/************************************************************
 * INICIAR
 ************************************************************/
async function iniciarScanner() {

  if (scannerRodando) {
    return;
  }

  if (
    typeof Html5Qrcode ===
      'undefined'
  ) {
    definirStatus(
      'A biblioteca do scanner não foi carregada.',
      true
    );

    return;
  }

  definirStatus(
    'Solicitando acesso à câmera...',
    false
  );

  try {

    const formatos = [
      Html5QrcodeSupportedFormats.QR_CODE,

      Html5QrcodeSupportedFormats.CODABAR,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E
    ];


    leitor =
      new Html5Qrcode(
        'reader',
        {
          formatsToSupport:
            formatos,

          /*
           * Força o decodificador ZXing
           * da biblioteca em vez de depender
           * do BarcodeDetector nativo.
           */
          useBarCodeDetectorIfSupported:
            false
        }
      );


    await leitor.start(
      {
        facingMode:
          'environment'
      },

      {
        fps: 10,

        /*
         * Sem qrbox:
         * usa uma área maior da câmera,
         * ajudando tanto códigos 1D largos
         * quanto QR Code.
         */
        disableFlip:
          false
      },

      function(
        decodedText,
        decodedResult
      ) {
        processarLeitura(
          decodedText,
          extrairFormatoHtml5(
            decodedResult
          ),
          'HTML5-QR'
        );
      },

      function(
        errorMessage
      ) {
        /*
         * É normal não encontrar código
         * em vários quadros consecutivos.
         * Não mostra erro na tela.
         */
      }
    );


    scannerRodando =
      true;

    await otimizarCamera();

    iniciarLeituraZBar();

    definirStatus(
      'Câmera ativa com leitura reforçada. Aponte para o código.',
      false,
      true
    );

  } catch (erro) {

    scannerRodando =
      false;

    leitor =
      null;

    const nome =
      erro &&
      erro.name
        ? erro.name
        : '';

    const mensagem =
      erro &&
      erro.message
        ? erro.message
        : String(
            erro || ''
          );


    if (
      nome ===
        'NotAllowedError' ||
      mensagem
        .toLowerCase()
        .includes(
          'permission'
        )
    ) {
      definirStatus(
        'Permissão da câmera não foi concedida. Deixe este site configurado como "Perguntar" e autorize quando abrir.',
        true
      );

      return;
    }


    if (
      nome ===
      'NotFoundError'
    ) {
      definirStatus(
        'Nenhuma câmera foi encontrada neste aparelho.',
        true
      );

      return;
    }


    if (
      nome ===
      'NotReadableError'
    ) {
      definirStatus(
        'A câmera está ocupada por outro aplicativo.',
        true
      );

      return;
    }


    definirStatus(
      'Não foi possível iniciar a câmera: ' +
      mensagem,
      true
    );
  }
}


/************************************************************
 * PARAR
 ************************************************************/
async function pararScanner() {

  pararLeituraZBar();

  if (
    !leitor ||
    !scannerRodando
  ) {
    return;
  }

  try {
    await leitor.stop();
  } catch (e) {}

  try {
    leitor.clear();
  } catch (e) {}

  scannerRodando =
    false;

  leitor =
    null;

  definirStatus(
    'Câmera parada.',
    false
  );
}


/************************************************************
 * LEITURA REFORÇADA
 ************************************************************/
function extrairFormatoHtml5(
  decodedResult
) {
  const candidatos = [
    decodedResult &&
      decodedResult.result &&
      decodedResult.result.format &&
      decodedResult.result.format.formatName,

    decodedResult &&
      decodedResult.result &&
      decodedResult.result.format &&
      decodedResult.result.format.format,

    decodedResult &&
      decodedResult.format,

    decodedResult &&
      decodedResult.symbology
  ];

  for (
    const valor
    of candidatos
  ) {
    const texto =
      String(
        valor || ''
      ).trim();

    if (texto) {
      return texto;
    }
  }

  return '';
}


function obterVideoAtivo() {
  return document.querySelector(
    '#reader video'
  );
}


async function otimizarCamera() {
  const video =
    obterVideoAtivo();

  const track =
    video &&
    video.srcObject &&
    video.srcObject
      .getVideoTracks
      ? video.srcObject
          .getVideoTracks()[0]
      : null;

  if (!track) {
    return;
  }

  /*
   * Tenta usar uma resolução alta.
   * Se o aparelho não aceitar, simplesmente
   * mantém a configuração escolhida pelo navegador.
   */
  try {
    await track.applyConstraints({
      width: {
        ideal: 1920
      },

      height: {
        ideal: 1080
      }
    });
  } catch (e) {}


  /*
   * Mantém foco contínuo quando a câmera oferece
   * esse recurso. Ajuda especialmente em etiquetas
   * pequenas e códigos com barras finas.
   */
  try {
    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};

    if (
      Array.isArray(
        capabilities.focusMode
      ) &&
      capabilities.focusMode.includes(
        'continuous'
      )
    ) {
      await track.applyConstraints({
        advanced: [
          {
            focusMode:
              'continuous'
          }
        ]
      });
    }
  } catch (e) {}
}


function inicializarZBar() {
  if (zbarDetector) {
    return true;
  }

  try {
    const api =
      window
        .barcodeDetectorPolyfill;

    if (
      !api ||
      !api.BarcodeDetectorPolyfill
    ) {
      return false;
    }

    zbarDetector =
      new api.BarcodeDetectorPolyfill({
        formats: [
          'codabar',
          'code_39',
          'code_93',
          'code_128',
          'databar',
          'databar_exp',
          'ean_8',
          'ean_13',
          'itf',
          'qr_code',
          'upc_a',
          'upc_e'
        ]
      });

    return true;

  } catch (e) {
    zbarDetector =
      null;

    return false;
  }
}


function iniciarLeituraZBar() {
  pararLeituraZBar();

  if (
    !scannerRodando ||
    !inicializarZBar()
  ) {
    return;
  }

  agendarZBar(
    120
  );
}


function pararLeituraZBar() {
  if (zbarTimer) {
    clearTimeout(
      zbarTimer
    );
  }

  zbarTimer =
    null;

  zbarBusy =
    false;
}


function agendarZBar(
  atraso
) {
  if (
    !scannerRodando ||
    !zbarDetector
  ) {
    return;
  }

  if (zbarTimer) {
    clearTimeout(
      zbarTimer
    );
  }

  zbarTimer =
    setTimeout(
      cicloZBar,
      atraso || 170
    );
}


function normalizarFormato(
  formato
) {
  return String(
    formato || ''
  )
    .trim()
    .toUpperCase()
    .replace(
      /[^A-Z0-9]/g,
      ''
    );
}


function ehCodabar(
  formato
) {
  return normalizarFormato(
    formato
  ).includes(
    'CODABAR'
  );
}


function normalizarPatrimonioLido(
  valor,
  formato
) {
  const bruto =
    String(
      valor || ''
    )
      .replace(
        /[\u0000-\u001F\u007F]/g,
        ''
      )
      .trim()
      .toUpperCase();

  if (!bruto) {
    return '';
  }

  /*
   * CODABAR usa A/B/C/D como caracteres
   * técnicos de início e fim.
   *
   * Exemplo:
   * A16025360A -> 16025360
   *
   * Também reconhecemos esse padrão quando
   * o leitor não informa a simbologia, mas
   * somente se o conteúdo interno for numérico
   * com pontuação válida de CODABAR.
   */
  const pareceCodabarComGuardas =
    /^[ABCD][0-9 .:+\/$-]+[ABCD]$/
      .test(
        bruto
      );

  if (
    ehCodabar(
      formato
    ) ||
    pareceCodabarComGuardas
  ) {
    const semGuardas =
      bruto
        .replace(
          /^[ABCD]/,
          ''
        )
        .replace(
          /[ABCD]$/,
          ''
        );

    if (
      !/^[0-9 .:+\/$-]+$/
        .test(
          semGuardas
        )
    ) {
      return '';
    }

    const digitos =
      semGuardas.replace(
        /\D/g,
        ''
      );

    return digitos.length >= 6
      ? digitos
      : '';
  }

  /*
   * Demais formatos continuam em modo seguro:
   * só números, ponto, hífen e espaços.
   * Não converte letras em números e não
   * extrai patrimônio de URL ou texto livre.
   */
  if (
    !/^[0-9.\-\s]+$/
      .test(
        bruto
      )
  ) {
    return '';
  }

  return bruto.replace(
    /\D/g,
    ''
  );
}


function escolherMelhorZBar(
  resultados
) {
  const validos =
    (resultados || [])
      .filter(
        function(item) {
          return (
            item &&
            normalizarPatrimonioLido(
              item.rawValue,
              item.format
            )
          );
        }
      );

  if (!validos.length) {
    return null;
  }

  /*
   * Se houver mais de um código visível,
   * prioriza o que ocupa maior área na imagem.
   */
  validos.sort(
    function(a, b) {
      const aa =
        a.boundingBox
          ? Number(
              a.boundingBox.width || 0
            ) *
            Number(
              a.boundingBox.height || 0
            )
          : 0;

      const bb =
        b.boundingBox
          ? Number(
              b.boundingBox.width || 0
            ) *
            Number(
              b.boundingBox.height || 0
            )
          : 0;

      return bb - aa;
    }
  );

  return validos[0];
}


function prepararImagemReforcada(
  video
) {
  if (
    !video ||
    !video.videoWidth ||
    !video.videoHeight ||
    !zbarContext
  ) {
    return false;
  }

  const larguraOriginal =
    video.videoWidth;

  const alturaOriginal =
    video.videoHeight;

  const escala =
    Math.min(
      2,
      1440 /
        larguraOriginal
    );

  const largura =
    Math.max(
      1,
      Math.round(
        larguraOriginal *
        escala
      )
    );

  const altura =
    Math.max(
      1,
      Math.round(
        alturaOriginal *
        escala
      )
    );

  if (
    zbarCanvas.width !==
      largura ||
    zbarCanvas.height !==
      altura
  ) {
    zbarCanvas.width =
      largura;

    zbarCanvas.height =
      altura;
  }

  zbarContext
    .drawImage(
      video,
      0,
      0,
      larguraOriginal,
      alturaOriginal,
      0,
      0,
      largura,
      altura
    );

  /*
   * Escala de cinza + contraste moderado.
   * É usado somente como segunda tentativa,
   * principalmente para etiquetas gastas.
   */
  try {
    const imagem =
      zbarContext
        .getImageData(
          0,
          0,
          largura,
          altura
        );

    const dados =
      imagem.data;

    for (
      let i = 0;
      i < dados.length;
      i += 4
    ) {
      const cinza =
        Math.round(
          dados[i] *
            0.299 +
          dados[i + 1] *
            0.587 +
          dados[i + 2] *
            0.114
        );

      const contraste =
        Math.max(
          0,
          Math.min(
            255,
            Math.round(
              128 +
              (
                cinza -
                128
              ) *
              1.55
            )
          )
        );

      dados[i] =
        contraste;

      dados[i + 1] =
        contraste;

      dados[i + 2] =
        contraste;
    }

    zbarContext
      .putImageData(
        imagem,
        0,
        0
      );

  } catch (e) {}

  return true;
}


async function cicloZBar() {
  if (
    !scannerRodando ||
    !zbarDetector ||
    zbarBusy
  ) {
    agendarZBar(
      180
    );

    return;
  }

  const video =
    obterVideoAtivo();

  if (
    !video ||
    video.readyState < 2
  ) {
    agendarZBar(
      180
    );

    return;
  }

  zbarBusy =
    true;

  zbarTentativa +=
    1;

  try {
    let resultados =
      [];

    try {
      resultados =
        await zbarDetector
          .detect(
            video
          );
    } catch (e) {}

    let melhor =
      escolherMelhorZBar(
        resultados
      );

    /*
     * A cada 3 tentativas sem leitura,
     * faz uma segunda passagem com
     * contraste reforçado.
     */
    if (
      !melhor &&
      zbarTentativa % 3 === 0 &&
      prepararImagemReforcada(
        video
      )
    ) {
      try {
        resultados =
          await zbarDetector
            .detect(
              zbarCanvas
            );
      } catch (e) {
        resultados =
          [];
      }

      melhor =
        escolherMelhorZBar(
          resultados
        );
    }

    if (
      melhor &&
      scannerRodando
    ) {
      processarLeitura(
        melhor.rawValue,
        melhor.format,
        'ZBAR-WASM'
      );
    }

  } finally {
    zbarBusy =
      false;

    agendarZBar(
      170
    );
  }
}


/************************************************************
 * LEITURA
 ************************************************************/
function processarLeitura(
  valor,
  formato,
  motor
) {
  const texto =
    String(
      valor || ''
    ).trim();

  if (!texto) {
    return;
  }

  const normalizado =
    normalizarPatrimonioLido(
      texto,
      formato
    );

  if (!normalizado) {
    definirStatus(
      'Código lido, mas o conteúdo não é um patrimônio válido: ' +
      texto,
      true
    );

    return;
  }

  const agora =
    Date.now();

  /*
   * Evita que o mesmo código seja
   * disparado dezenas de vezes enquanto
   * a câmera continua apontada para ele.
   */
  if (
    normalizado ===
      ultimoNormalizado &&
    agora -
      ultimoHorario <
      2500
  ) {
    return;
  }

  ultimoNormalizado =
    normalizado;

  ultimoHorario =
    agora;


  if (
    lidos.has(
      normalizado
    )
  ) {
    definirStatus(
      'Patrimônio ' +
      normalizado +
      ' já foi lido nesta sessão.',
      false
    );

    return;
  }


  lidos.add(
    normalizado
  );


  document
    .getElementById(
      'quantidade'
    )
    .textContent =
      String(
        lidos.size
      );


  document
    .getElementById(
      'ultimo'
    )
    .textContent =
      normalizado;


  const item =
    document.createElement(
      'div'
    );

  item.className =
    'item';

  item.textContent =
    normalizado;

  document
    .getElementById(
      'lista'
    )
    .prepend(item);


  definirStatus(
    'Patrimônio ' +
    normalizado +
    ' lido ✓' +
    (
      motor
        ? ' · ' + motor
        : ''
    ),
    false,
    true
  );


  if (
    navigator.vibrate
  ) {
    navigator.vibrate(
      90
    );
  }


  tocarBip();


  /*
   * Envia automaticamente
   * para a janela Consulta Patrimonial.
   */
  if (
    window.opener &&
    returnOrigin
  ) {
    try {

      window.opener.postMessage(
        {
          tipo:
            'ACADEPOL_PATRIMONIO',

          valor:
            normalizado
        },
        returnOrigin
      );

    } catch (e) {}
  }
}


/************************************************************
 * BIP
 ************************************************************/
function tocarBip() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const contexto =
      new AudioContext();

    const oscilador =
      contexto.createOscillator();

    const ganho =
      contexto.createGain();

    oscilador
      .connect(
        ganho
      );

    ganho
      .connect(
        contexto.destination
      );

    oscilador.frequency.value =
      900;

    ganho.gain.value =
      0.05;

    oscilador.start();

    oscilador.stop(
      contexto.currentTime +
      0.08
    );

  } catch (e) {}
}


/************************************************************
 * STATUS
 ************************************************************/
function definirStatus(
  texto,
  erro,
  sucesso
) {
  const el =
    document.getElementById(
      'status'
    );

  el.textContent =
    texto;

  el.className =
    'status';

  if (erro) {
    el.classList.add(
      'erro'
    );

  } else if (sucesso) {
    el.classList.add(
      'ok'
    );
  }
}


/************************************************************
 * ENCERRAR
 ************************************************************/
window.addEventListener(
  'beforeunload',
  function() {

    pararLeituraZBar();

    if (
      leitor &&
      scannerRodando
    ) {
      try {
        leitor.stop();
      } catch (e) {}
    }

  }
);

</script>
